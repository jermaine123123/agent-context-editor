name: Bug report
description: Report a reproducible behavior problem
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not attach prompts, session logs, API keys or other private data.
  - type: input
    id: adapter
    attributes:
      label: Adapter and version
      placeholder: context-editor-deepseek-harness 0.1.1
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: Host and version
      placeholder: DeepSeek Harness 0.1.0-rc.6
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
